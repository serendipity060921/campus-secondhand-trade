# =============================================================================
# Nginx 站点配置（Windows 原生部署版）—— v0.15
#
# 与容器版的区别只有两处：proxy_pass 指向 127.0.0.1:8080，root 指向本机 dist 目录。
# 部署路径按实际情况修改（本文件默认值对应 D:\campus-secondhand-trade）。
#
# 使用：把本文件放到 nginx 解压目录的 conf\nginx.conf，然后 nginx.exe（或 nginx -s reload）
# =============================================================================

worker_processes  1;                       # Windows 版 nginx 用单 worker 即可

error_log  logs/campus-error.log  warn;
pid        logs/campus.pid;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format  campus  '$remote_addr - [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" rt=$request_time';
    access_log  logs/campus-access.log  campus;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 10m;
    charset utf-8;

    # 压缩
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;
    gzip_vary on;

    # 后端上游（本机 8080）
    upstream campus_backend {
        server 127.0.0.1:8080;
        keepalive 32;
    }

    server {
        # ⚠️ 本机端口说明：默认写 8081 而不是 80，原因是这台机器的 80 端口被
        #    Steam++（Watt Toolkit 加速器）占用。生产/服务器环境请改回 80。
        #    想确认端口占用：netstat -ano | findstr :80
        listen       8081;
        server_name  localhost;

        # 前端打包产物目录（v0.15 由 pnpm build 生成）
        root   D:/campus-secondhand-trade/frontend/dist;
        index  index.html;

        # ---------------------- 反向代理公共设置（server 级，所有 location 继承）----------------------
        # ⚠️ 下面这两行（proxy_http_version 1.1 + Connection ""）必须与 upstream 的 keepalive 配套，
        #    否则上游连接被复用时后端会返回 400 Bad Request
        #    —— v0.15 部署验证时真实踩到：/api 正常但 /health 报 Tomcat 400。
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;

        # ---------------------------- 静态资源 ----------------------------
        location ~* \.(js|css|png|jpg|jpeg|gif|webp|svg|woff2?|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
            try_files $uri =404;
        }

        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # Vue Router history 模式：刷新 /chat/5 这类地址时回退到 index.html
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ---------------------------- 接口反向代理 ----------------------------
        # 公共代理头已在 server 级统一设置，这里只需指定上游
        location /api/ {
            proxy_pass http://campus_backend;
        }

        # 上传的图片（后端静态资源映射）
        location /upload/ {
            proxy_pass http://campus_backend;
            expires 7d;
        }

        # ---------------------------- WebSocket 实时私信 ----------------------------
        location /ws/ {
            proxy_pass http://campus_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;      # ← 缺少这两行 WebSocket 会握手失败
            proxy_set_header Connection "upgrade";
            proxy_set_header Host       $host;
            proxy_set_header X-Real-IP  $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 300s;                        # 长连接放宽超时
            proxy_send_timeout 300s;
            proxy_buffering off;
        }

        # 运维探活（转发到后端存活探针；代理头继承 server 级设置）
        location = /health {
            proxy_pass http://campus_backend/api/health;
            access_log off;
        }
    }
}
