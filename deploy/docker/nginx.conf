# =============================================================================
# Nginx 站点配置（容器版）—— v0.15
#
# 一份配置干三件事：
#   ① 托管前端静态资源（Vue 是单页应用，必须做 history 路由回退）
#   ② /api/ 与 /upload/ 反向代理到后端容器（浏览器只访问 80 端口，不存在跨域）
#   ③ /ws/ 反向代理并**升级为 WebSocket 长连接**（实时私信依赖它）
#
# ⚠️ 最容易踩的坑：proxy_set_header Upgrade / Connection 这两个头不能少，
#    否则 WebSocket 握手会失败（表现为聊天一直"连接中断"）。
# =============================================================================

# 上游后端（容器名即服务名，docker 内置 DNS 解析）
upstream campus_backend {
    server backend:8080;
    keepalive 32;
}

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    client_max_body_size 10m;      # 与后端上传上限（5MB×多图）匹配

    # ---------------------- 反向代理公共设置（server 级，所有 location 继承）----------------------
    # ⚠️ proxy_http_version 1.1 + Connection "" 必须与 upstream 的 keepalive 配套，
    #    否则上游连接复用时后端会返回 400 Bad Request（v0.15 部署验证时真实踩到）
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";
    proxy_connect_timeout 10s;
    proxy_read_timeout    60s;
    proxy_send_timeout    60s;

    # 访问日志（进入容器日志，可用 docker logs 查看）
    access_log /var/log/nginx/campus-access.log;
    error_log  /var/log/nginx/campus-error.log warn;

    # ---------------------------- 压缩 ----------------------------
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;
    gzip_vary on;

    # ---------------------------- 前端单页应用 ----------------------------
    # 静态资源（带 hash 的文件名）长缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|webp|svg|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # index.html 不缓存（否则发版后用户仍拿到旧页面，会出现"白屏/接口 404"）
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 其余路径交给 Vue Router（刷新 /chat/5 这类地址时由它返回 index.html）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------------------------- 接口反向代理 ----------------------------
    # 公共代理头已在 server 级统一设置
    location /api/ {
        proxy_pass http://campus_backend;
    }

    # 上传的图片走后端静态资源映射
    location /upload/ {
        proxy_pass http://campus_backend;
        expires 7d;
    }

    # ---------------------------- WebSocket 实时私信 ----------------------------
    location /ws/ {
        proxy_pass http://campus_backend;
        # WebSocket 必须用 HTTP/1.1 并且显式要求协议升级
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 长连接不能被网关按"空闲"掐断：客户端 25 秒心跳 + 这里放宽到 300 秒
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    # 后端健康检查透传（运维排查用；代理头继承 server 级设置）
    location = /health {
        proxy_pass http://campus_backend/api/health;
        access_log off;
    }
}
