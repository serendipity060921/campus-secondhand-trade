<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>首页目录 · 三张设计稿对比</title>
<style>
  body{margin:0;padding:32px;background:#f5f6f3;color:#1a1d19;
       font:400 14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
  h1{font-size:20px;margin:0 0 6px}
  p.lead{color:#5c6159;margin:0 0 28px}
  .grid{display:grid;gap:32px}
  figure{margin:0}
  figcaption{font-size:14px;font-weight:600;margin-bottom:10px}
  img{width:100%;max-width:1536px;border:1px solid #c9ccc4;background:#fff;display:block}
</style>
</head>
<body>
  <h1>首页目录 · 三张设计稿</h1>
  <p class="lead">同一套设计语言（索书号与卡片目录）的三种构图。选一张，我按它的构图实现首页。</p>
  <div class="grid">
  <figure>
    <figcaption>A · 横向分类色带 + 三列目录卡 + 右栏</figcaption>
    <img src="comp-a-home-list.png" alt="comp A">
  </figure>
  <figure>
    <figcaption>B · 左侧竖向书脊 + 四列密卡（无右栏）</figcaption>
    <img src="comp-b-home-list.png" alt="comp B">
  </figure>
  <figure>
    <figcaption>C · 左侧标签轨 + 一张焦点大卡 + 紧凑目录表</figcaption>
    <img src="comp-c-home-list.png" alt="comp C">
  </figure>
  </div>
</body>
</html>
