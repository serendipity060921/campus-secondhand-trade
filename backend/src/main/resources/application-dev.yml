# =============================================================================
# 开发环境配置（dev）
# 数据库连接支持环境变量覆盖，便于换机器 / 换端口：
#   MYSQL_HOST / MYSQL_PORT / MYSQL_DB / MYSQL_USER / MYSQL_PASSWORD
# IDEA 中也可直接在 Run Configuration 的 Environment variables 里填写
# =============================================================================
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:campus_trade}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:123456}
    hikari:
      # 连接池
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1
  # ---------------------------------------------------------------------------
  # Redis 连接（v0.12 缓存与限流）
  # 支持环境变量覆盖：REDIS_HOST / REDIS_PORT / REDIS_PASSWORD / REDIS_DB
  # 本机 Redis（Windows 版）已注册为服务 RedisCampus，默认 6379、无密码
  # ---------------------------------------------------------------------------
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}
      timeout: 3000ms
      connect-timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 2000ms
        shutdown-timeout: 200ms

# 跨域允许的前端来源（Vite 开发服务器地址）
app:
  version: v0.15
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173
