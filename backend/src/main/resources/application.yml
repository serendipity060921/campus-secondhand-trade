# =============================================================================
# 校园二手交易平台 - 主配置（所有环境共用）
# 版本：v0.03  里程碑：前后端分离项目脚手架
# =============================================================================
server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true
  tomcat:
    uri-encoding: UTF-8

spring:
  application:
    name: campus-trade-backend
  mvc:
    # 找不到接口时抛 NoHandlerFoundException，交由全局异常处理器返回统一 JSON
    throw-exception-if-no-handler-found: true
  web:
    resources:
      # 后端不提供静态资源（前端由 Vite / Nginx 托管），关闭默认静态映射
      add-mappings: false
  # 激活的环境：dev（开发）/ prod（生产），可用启动参数 --spring.profiles.active=prod 覆盖
  profiles:
    active: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 20MB

mybatis-plus:
  # Mapper XML 位置（复杂的多表 SQL 写这里，简单单表 CRUD 用注解/内置方法）
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.campus.trade.entity
  configuration:
    # 下划线自动映射驼峰：create_time -> createTime
    map-underscore-to-camel-case: true
    # 开发期打印 SQL，便于调试
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      # 逻辑删除配置：deleted = 0 未删除，1 已删除
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 日志级别
logging:
  level:
    root: info
    com.campus.trade: debug

# =============================================================================
# 推荐算法参数（v0.11 推荐模块）
# 说明：把行为权重、融合系数、多样性上限等做成配置项，调参不用改代码，
#       离线评测脚本（tools/recommend-eval.py）可通过参数覆盖做对比实验
# =============================================================================
app:
  # 应用版本（前端 src/utils/version.js 与之保持一致）
  version: v0.16

campus:
  recommend:
    # 是否启用个性化（false 时所有场景退化为热门推荐，可用于 A/B 对比）
    enabled: true
    # 各行为的兴趣权重：1浏览 2收藏 3私信 4下单
    behavior-weights:
      1: 1.0
      2: 3.0
      3: 2.0
      4: 5.0
    # 融合权重（三路归一化后加权求和，建议和为 1）
    cf-weight: 0.50          # 协同过滤（Item-CF）
    content-weight: 0.35     # 内容匹配（分类 + 价格 + 校区）
    hot-weight: 0.15         # 热门度（浏览量 + 收藏量 + 行为人数 + 新鲜度）
    # 时间衰减半衰期（天）：weight(t) = 0.5 ^ (距今天数 / half-life-days)
    half-life-days: 30
    # 候选池与返回条数
    candidate-pool-size: 200
    default-size: 8
    max-size: 30
    # 同一分类最多出现几条（多样性控制）
    category-cap: 3
    # 相似商品（详情页"相关推荐"）
    similar-size: 6
    similar-threshold: 0.02
    # 仅浏览过（未收藏未下单）的商品得分惩罚系数
    seen-penalty: 0.55
    # 与用户校区一致时的内容加成
    campus-bonus: 0.15
    # 冷启动（未登录 / 无行为）返回条数
    cold-start-size: 12

# =============================================================================
# 缓存与限流参数（v0.12）
# 说明：campus.cache.enabled=false 可一键关闭缓存（用于压测对照实验），业务代码无需改动
# =============================================================================
  cache:
    enabled: true
    key-prefix: campus
    # 各类缓存 TTL（秒）
    product-list-ttl: 60
    product-detail-ttl: 120
    category-ttl: 600
    recommend-ttl: 300
    null-value-ttl: 30
    # TTL 随机抖动比例：防止大批 Key 同时失效（缓存雪崩）
    ttl-jitter: 0.2
    # 浏览量去重窗口（秒）与批量回写阈值
    view-dedup-seconds: 600
    view-flush-threshold: 20
    # 热门榜（ZSet）保留天数与行为加分
    hot-list-ttl-days: 3
    hot-score-view: 1.0
    hot-score-favorite: 5.0
    hot-score-message: 3.0
    hot-score-order: 10.0
    # 分布式锁 TTL（防缓存击穿）
    lock-ttl: 10

  # ===========================================================================
  # 业务开关（v0.13 管理后台）
  # audit.enabled = true 时新发布商品进入「待审核」，管理员审核通过后才上架；
  # 默认 false = 沿用"发布即上架"（与既有接口行为和自动化测试兼容）
  # ===========================================================================
  audit:
    enabled: false
    allow-resubmit: true
