name: CI

# 说明：
#   本工作流只做「不需要数据库、Redis 与浏览器」的检查，因此在 GitHub 托管机上稳定可跑：
#     1) 设计令牌纪律  —— 组件层不得出现裸色值，发现数只许下降不许上升（棘轮）
#     2) 前端纯函数单测 —— catalogue（索书号规则）+ product-rules（发布校验规则），两个都必须跑
#     3) 后端单元测试 + 打包 —— v0.17 起已建立后端单测（内容机审等），不再跳过测试
#     4) 前端覆盖率（c8）+ 依赖漏洞审计（critical 级别阻断）—— v0.18 接入
#   需要真实环境的端到端用例（tests/e2e、tests/api）不在此运行，它们在本地对
#   已部署的实例执行（见 README 的测试章节）。

on:
  push:
    branches: [master, 'ui/**']
  pull_request:
  workflow_dispatch:

jobs:
  design-guard:
    name: 设计令牌纪律
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 棘轮阈值：初次接入令牌层时组件层有 126 处裸色值（2026-10-04 实测）。
      # 每清理完一个页面族就把这个数字下调，规范只会越来越紧，不会反弹。
      # 棘轮一：组件层不得再出现任何裸色值。
      # 2026-10-04 起 126 处已全部令牌化，因此阈值锁死为 0 —— 只许保持，不许回退。
      - name: 设计令牌纪律检查（组件层裸色值必须为 0）
        run: python tools/check-tokens.py --max-errors 0

      # 棘轮二：状态完备性 + 加载态升级 + 键盘可达性（全站改版完成后的终值）。
      # 状态缺失 0（20/20 达标）、鼠标独占点击元素 0（全站键盘可达）、
      # 仍用转圈遮罩 5（骨架屏 11/20；其余为后台看板、订单两页、资料编辑与开发用 Home）。
      # 三个阈值都只许下降；验证方式：把任一阈值收紧一档，脚本必须非零退出（已实测）。
      - name: 状态与可达性检查（阈值只许下降）
        run: python tools/check-states.py --max-missing 0 --max-mouse-only 0 --max-spinner 5

      # 棘轮三：后端代码卫生（System.out 直接打印 / printStackTrace / 空 catch /
      # 硬编码口令 / SELECT * / 通配符 import / TODO）。发现数只许下降。
      - name: 后端代码卫生检查（棘轮：发现数只许下降）
        run: python tools/check-backend.py --label ci

      # 棘轮四：写接口限流覆盖（v0.18 接入）—— 所有 POST/PUT/DELETE 接口要么带 @RateLimit，
      # 要么在脚本白名单里写明"为什么不加限流"。阈值锁死为 0：不允许存在"漏加限流"的写接口。
      # 该检查在本地抓到一个真实缺陷：/api/auth/login 是 /api/user/login 的别名接口，
      # 却没带限流注解 —— 等于给暴力破解留了一条绕行通道（已修复，见 docs/缺陷跟踪表.md）。
      - name: 写接口限流覆盖检查（未限流且无理由的必须为 0）
        run: python tools/check-ratelimit.py --max-missing 0 --json --label ci

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ratelimit-report
          path: .impeccable/review/ci/ratelimit-ci.json
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-hygiene
          path: .impeccable/review/ci/backend-hygiene.json
          if-no-files-found: ignore

      - name: 输出令牌纪律报告
        if: always()
        run: python tools/check-tokens.py --label ci

      - uses: actions/setup-node@v4
        with:
          # 必须与仓库实际使用的 Node 版本对齐：pnpm 11 要求 Node >= 22，
          # 早期写 20 会导致 pnpm 安装/运行失败（本地为 Node 24 + pnpm 11.7.0，已实测通过）。
          node-version: 24

      # 前端纯函数单测：两个文件都必须跑 —— 只跑 catalogue 会让 product-rules 的改动绕过 CI。
      - name: 纯函数单元验证（索书号规则 + 商品发布校验规则）
        run: |
          node tests/unit/catalogue.test.mjs
          node tests/unit/product-rules.test.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tokens-lint
          path: .impeccable/review/ci/tokens-lint.json
          if-no-files-found: ignore

  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # 顺序很重要：先装 Node，再装 pnpm。
      # 反过来的话，pnpm/action-setup 会在 runner 默认的旧 Node 上安装 pnpm 11 并自检失败。
      # 因此这里不使用 setup-node 的 pnpm 缓存（缓存要求 pnpm 已存在）。
      - uses: actions/setup-node@v4
        with:
          # pnpm 11 要求 Node >= 22；本地验证环境为 Node 24 + pnpm 11.7.0。
          node-version: 24

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 安装依赖（冻结锁文件，杜绝"本机能跑"）
        run: pnpm install --frozen-lockfile

      - name: 构建
        run: pnpm build

      # 前端覆盖率（v0.18 引入 c8）：统计被单测直接引用的纯函数模块。
      # 口径见 docs/测试覆盖率说明.md 第八节 —— 只含 utils 层，
      # 组件与页面的渲染交互由端到端测试覆盖，不纳入行覆盖率统计。
      - name: 前端覆盖率（c8，纯函数模块）
        run: pnpm test:coverage

      # 依赖漏洞审计（v0.18 接入）：
      #   阻断级别取 critical —— 当前仓库有 1 个 high + 3 个 moderate，全部集中在
      #   vite / esbuild 这类**构建期依赖**（不会进入生产产物），已在
      #   docs/安全测试报告.md 中记录并给出升级路径，因此不阻断日常提交；
      #   但一旦出现 critical 级别漏洞，CI 必须失败。
      - name: 依赖漏洞审计（critical 级别阻断）
        run: pnpm audit --audit-level=critical

      # 完整审计报告留档（非阻断），便于在 Actions 产物里查看中低危明细
      - name: 导出依赖审计报告
        if: always()
        run: pnpm audit --json > audit-report.json || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-audit
          path: frontend/audit-report.json
          if-no-files-found: ignore

  backend:
    name: 后端编译
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      # v0.17 起项目已建立后端单元测试（内容机审 ContentModeratorTest 等 15 条），
      # 因此这里不再跳过测试：package 会先执行 test，测试失败即 CI 失败。
      # 同时 jacoco 插件会生成覆盖率报告，并执行"覆盖率棘轮"检查（只许上升）。
      - name: 单元测试 + 打包（使用仓库自带的 Maven Wrapper，不依赖 runner 预装版本）
        run: ./mvnw -B package

      # 覆盖率报告（target/site/jacoco）：CI 里虽看不到 HTML，但可作为产物下载查看
      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage
          path: backend/target/site/jacoco/
          if-no-files-found: ignore
